<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Price Calculator | America Home Financial</title>
  <meta name="description" content="Estimate your job cost, set your price, and know what to charge when a customer finances.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
/* Hallmark v2.0.0; redesign; brand: America Home Financial (navy, blue, red; Montserrat + Open Sans); scope: app screen; genre: modern-minimal; deal: manual (theme library not installed); signature: the cash price and lender pick updating beside the inputs */
/* critique: a working tool, not a page; inputs left, answer right; sections are ruled, not boxed, so only the price panel and the picked plan carry fill */
/* note: sloplint not run (Hallmark scripts not installed); Floor checked by hand */

:root {
  /* brand */
  --c-navy: #1b2a57;
  --c-blue: #2b5fae;
  --c-red: #c8283a;

  /* surfaces and text */
  --c-page: #ffffff;
  --c-ink: #1b2a57;
  --c-muted: #5d6680;
  --c-line: #dde2ec;
  --c-line-strong: #b9c2d4;
  --c-field: #f5f7fb;
  --c-soft: #eaf0f9;
  --c-on-dark: #ffffff;
  --c-on-dark-muted: #c9d6ee;
  --c-on-dark-line: #34457a;
  --c-bar-cost: #8eaedc;
  --c-bar-overhead: #4f80c9;
  --c-bar-profit: #c8283a;
  --c-thumb-shadow: rgba(27, 42, 87, 0.25);
  --c-error-on-dark: #ffb3ba;

  /* type */
  --f-display: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* shape */
  --radius: 6px;
  --gap: 48px;
  --measure: 1040px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; font-size: 12px; overflow-x: clip; }
body {
  margin: 0;
  overflow-x: clip;
  background: var(--c-page);
  color: var(--c-ink);
  font: 1.08rem/1.45 var(--f-body);
}
h1, h2 { overflow-wrap: break-word; min-width: 0; }

/* ---------- frame ---------- */
.shell { max-width: var(--measure); margin: 0 auto; padding: 20px 24px 28px; }
.masthead { padding-bottom: 14px; border-bottom: 2px solid var(--c-navy); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.4rem, 4vw, 1.7rem); color: var(--c-navy); line-height: 1.15; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--gap); align-items: start; }
.col { min-width: 0; }
.colophon {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
  margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--c-line);
  font-size: 0.85rem; color: var(--c-muted);
}
.colophon p { margin: 0; }
.colophon p:first-child { font-family: var(--f-display); font-weight: 700; color: var(--c-navy); }
.noscript { max-width: var(--measure); margin: 0 auto; padding: 0 24px 24px; color: var(--c-muted); }

/* ---------- sections: ruled, not boxed ---------- */
.group { padding: 16px 0 14px; border-bottom: 1px solid var(--c-line); }
.col > .group:last-child { border-bottom: none; }
.group h2 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--c-navy); }

/* ---------- slider rows: label | slider | value ---------- */
.slide-row { display: grid; grid-template-columns: 118px minmax(0, 1fr) 100px; align-items: center; gap: 4px 12px; padding: 4px 0; }
.slide-row > label { font-weight: 600; line-height: 1.25; }

input {
  font: inherit; font-weight: 600; color: var(--c-ink);
  background: var(--c-field);
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  padding: 5px 9px;
  width: 100%; min-width: 0;
  font-variant-numeric: tabular-nums;
}
input:hover { border-color: var(--c-line-strong); }
input:focus { outline: none; }
input:focus-visible, .val input:focus { outline: 2px solid var(--c-blue); outline-offset: 1px; border-color: transparent; background: var(--c-page); }
input:disabled { opacity: 0.5; cursor: not-allowed; }

.money, .pct, .unit { position: relative; display: block; }
.money::before, .pct::after, .hrs::after, .rate::after {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--c-muted); font-weight: 400; pointer-events: none;
}
.money::before { content: "$"; left: 10px; }
.money input { padding-left: 21px; }
.pct::after { content: "%"; right: 10px; }
.pct input { padding-right: 26px; }
.hrs::after { content: "hrs"; right: 9px; font-size: 0.85rem; }
.hrs input { padding-right: 34px; }
.rate::after { content: "/hr"; right: 9px; font-size: 0.85rem; }
.rate input { padding-right: 32px; }

.slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0;
  background: transparent; cursor: pointer; padding: 0; border: none;
}
.slider:hover { border: none; }
.slider::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--c-blue) var(--fill, 0%), var(--c-line) var(--fill, 0%));
}
.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--c-line); }
.slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--c-blue); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
  background: var(--c-page); border: 2px solid var(--c-blue); box-shadow: 0 1px 3px var(--c-thumb-shadow);
}
.slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--c-page); border: 2px solid var(--c-blue); }
.slider:active::-webkit-slider-thumb { background: var(--c-soft); }
.slider:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; background: transparent; }

.total-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--c-line); font-weight: 700;
}
.total-row strong { font-family: var(--f-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }

/* ---------- price panel (signature) ---------- */
.price-panel {
  margin-top: 16px; padding: 16px 18px 14px; border-radius: var(--radius);
  background: var(--c-navy); color: var(--c-on-dark);
}
.price-panel h2 { margin: 0; font-family: var(--f-body); font-weight: 600; font-size: 0.92rem; color: var(--c-on-dark-muted); }
.price-figure { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 2.5rem); line-height: 1.15; font-variant-numeric: tabular-nums; }
.price-error { color: var(--c-error-on-dark); margin: 6px 0 0; }
.split { display: flex; gap: 2px; height: 6px; border-radius: 2px; overflow: hidden; margin-top: 12px; }
.split span { min-width: 3px; }
.s-cost { background: var(--c-bar-cost); }
.s-oh { background: var(--c-bar-overhead); }
.s-profit { background: var(--c-bar-profit); }
.split-legend { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; color: var(--c-on-dark-muted); }
.split-legend li { display: flex; align-items: center; gap: 6px; }
.split-legend i { width: 8px; height: 8px; border-radius: 2px; }
.split-legend b { color: var(--c-on-dark); font-variant-numeric: tabular-nums; }

/* ---------- financing ---------- */
.choice { border: none; padding: 0; margin: 0 0 10px; min-width: 0; }
.choice legend { font-size: 0.85rem; color: var(--c-muted); padding: 0; margin-bottom: 4px; }
.seg {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px;
  background: var(--c-line); border: 1px solid var(--c-line); border-radius: var(--radius); overflow: hidden;
}
.seg-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg label { position: relative; cursor: pointer; display: block; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span {
  display: block; padding: 6px 4px; text-align: center; white-space: nowrap;
  background: var(--c-page); font-weight: 600; font-size: 0.88rem; color: var(--c-ink);
}
.seg label:hover span { background: var(--c-soft); }
.seg input:active + span { background: var(--c-soft); }
.seg input:checked + span { background: var(--c-navy); color: var(--c-on-dark); }
.seg input:focus-visible + span { outline: 2px solid var(--c-blue); outline-offset: -2px; }
.seg input:disabled + span { opacity: 0.5; cursor: not-allowed; }

.rec-card { margin-top: 4px; padding: 10px 12px; border-radius: var(--radius); background: var(--c-soft); border-left: 4px solid var(--c-blue); }
.rec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.rec-lender { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.rec-plan { color: var(--c-muted); }
.rec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
.rec-grid div { display: flex; flex-direction: column; min-width: 0; }
.rec-grid span { font-size: 0.8rem; color: var(--c-muted); }
.rec-grid strong { font-variant-numeric: tabular-nums; }
.rec-price { font-family: var(--f-display); font-size: 1.35rem; color: var(--c-blue); line-height: 1.2; }
.no-rec { padding: 10px 12px; border-radius: var(--radius); background: var(--c-field); color: var(--c-muted); }

.plan-list { list-style: none; margin: 0; padding: 0; }
#others .plan-list { margin-top: 6px; }
.plan { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--c-line); }
.plan:last-child { border-bottom: none; }
.plan-info { min-width: 0; }
.plan-name { font-weight: 600; }
.plan-meta { font-size: 0.85rem; color: var(--c-muted); }
.plan-figs { text-align: right; flex: none; display: flex; flex-direction: column; }
.plan-figs strong { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; color: var(--c-blue); font-variant-numeric: tabular-nums; }
.plan-figs span { font-size: 0.82rem; color: var(--c-muted); font-variant-numeric: tabular-nums; }

details summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--c-blue); list-style: none; padding: 4px 0; border-radius: 2px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; display: inline-block; width: 1.1em; font-weight: 700; }
details[open] summary::before { content: "−"; }
details summary:hover { text-decoration: underline; text-underline-offset: 3px; }
details summary:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }
.more { margin-top: 6px; }
.excluded { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--c-line); font-size: 0.9rem; }
.excluded ul { list-style: none; padding: 0; margin: 6px 0 0; }
.excluded li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--c-line); }
.excluded em { font-style: normal; color: var(--c-muted); text-align: right; }

/* ---------- stacked: tablets and phones ---------- */
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col + .col .price-panel { margin-top: 4px; }
  .col:first-child > .group:last-child { border-bottom: 1px solid var(--c-line); }
}
@media (max-width: 520px) {
  .shell { padding: 16px 16px 24px; }
  .slide-row { grid-template-columns: minmax(0, 1fr) 100px; padding: 3px 0 1px; }
  .slide-row > label { grid-column: 1; grid-row: 1; }
  .slide-row > .val { grid-column: 2; grid-row: 1; }
  .slide-row > .slider { grid-column: 1 / -1; grid-row: 2; }
  .seg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rec-grid { grid-template-columns: 1fr 1fr; }
  .rec-grid div:first-child { grid-column: 1 / -1; }
  .excluded li { flex-direction: column; gap: 0; }
  .excluded em { text-align: left; }
}

/* Phones viewing the page directly: inputs at 16px so iOS doesn't zoom on tap */
@media (min-width: 360px) and (max-width: 520px) {
  input { font-size: 16px; }
}

/* Narrow frames, e.g. a Wix mobile embed laid out narrow and scaled up:
   shrink text and spacing with the frame width. */
@media (max-width: 359px) {
  html { font-size: clamp(8.5px, 3.1vw, 12px); }
  input { font-size: 1.1rem; padding: 4px 7px; }
  .shell { padding: 12px 8px 16px; }
  .slide-row { grid-template-columns: minmax(0, 1fr) 34%; gap: 2px 8px; }
  .seg span { padding: 5px 2px; font-size: 0.85rem; }
  .price-panel { padding: 12px; }
  .rec-card { padding: 8px 10px; }
  .money::before { left: 7px; }
  .money input { padding-left: 16px; }
  .pct::after { right: 7px; }
  .pct input { padding-right: 18px; }
  .hrs::after, .rate::after { right: 6px; }
  .hrs input { padding-right: 26px; }
  .rate input { padding-right: 24px; }
}

@media print {
  .excluded, .more { display: none !important; }
  .price-panel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1>Job price calculator</h1>
    </header>

    <main class="layout">
      <div class="col">
        <section class="group" aria-labelledby="h-costs">
          <h2 id="h-costs">Job costs</h2>
          <div class="slide-row">
            <label for="materials">Materials</label>
            <input type="range" class="slider" data-for="materials" min="0" max="100000" step="100" value="6000" aria-label="Materials" tabindex="-1">
            <div class="money val"><input id="materials" type="text" inputmode="decimal" autocomplete="off" value="6000"></div>
          </div>
          <div class="slide-row">
            <label for="wastePct">Waste</label>
            <input type="range" class="slider" data-for="wastePct" min="0" max="30" step="1" value="10" aria-label="Waste" tabindex="-1">
            <div class="pct val"><input id="wastePct" type="text" inputmode="decimal" autocomplete="off" value="10"></div>
          </div>
          <div class="slide-row">
            <label for="laborHours">Labor hours</label>
            <input type="range" class="slider" data-for="laborHours" min="0" max="500" step="1" value="80" aria-label="Labor hours" tabindex="-1">
            <div class="unit hrs val"><input id="laborHours" type="text" inputmode="decimal" autocomplete="off" value="80"></div>
          </div>
          <div class="slide-row">
            <label for="laborRate">Labor rate</label>
            <input type="range" class="slider" data-for="laborRate" min="0" max="150" step="1" value="55" aria-label="Labor rate" tabindex="-1">
            <div class="money unit rate val"><input id="laborRate" type="text" inputmode="decimal" autocomplete="off" value="55"></div>
          </div>
          <div class="slide-row">
            <label for="subs">Subcontractors</label>
            <input type="range" class="slider" data-for="subs" min="0" max="100000" step="100" value="0" aria-label="Subcontractors" tabindex="-1">
            <div class="money val"><input id="subs" type="text" inputmode="decimal" autocomplete="off" value="0"></div>
          </div>
          <div class="slide-row">
            <label for="other">Permits &amp; other</label>
            <input type="range" class="slider" data-for="other" min="0" max="20000" step="50" value="800" aria-label="Permits and other" tabindex="-1">
            <div class="money val"><input id="other" type="text" inputmode="decimal" autocomplete="off" value="800"></div>
          </div>
          <div class="total-row" aria-live="polite">
            <span>Total job cost</span>
            <strong id="cost-total">—</strong>
          </div>
        </section>

        <section class="group" aria-labelledby="h-markup">
          <h2 id="h-markup">Markup</h2>
          <div class="slide-row">
            <label for="overheadPct">Overhead</label>
            <input type="range" class="slider" data-for="overheadPct" min="0" max="40" step="1" value="15" aria-label="Overhead" tabindex="-1">
            <div class="pct val"><input id="overheadPct" type="text" inputmode="decimal" autocomplete="off" value="15"></div>
          </div>
          <div class="slide-row">
            <label for="marginPct">Profit</label>
            <input type="range" class="slider" data-for="marginPct" min="0" max="40" step="1" value="20" aria-label="Profit" tabindex="-1">
            <div class="pct val"><input id="marginPct" type="text" inputmode="decimal" autocomplete="off" value="20"></div>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="price-panel" aria-labelledby="h-price" aria-live="polite">
          <h2 id="h-price">Cash price</h2>
          <div id="cash-price" class="price-figure">—</div>
          <div id="split-bar" class="split" aria-hidden="true"></div>
          <ul id="split-legend" class="split-legend"></ul>
          <p id="price-error" class="price-error" hidden></p>
        </section>

        <section class="group" aria-labelledby="h-fin">
          <h2 id="h-fin">Financing</h2>
          <fieldset class="choice">
            <legend>Credit score</legend>
            <div class="seg" role="radiogroup">
              <label><input type="radio" name="score" value="725" checked><span>725+</span></label>
              <label><input type="radio" name="score" value="680"><span>680–724</span></label>
              <label><input type="radio" name="score" value="650"><span>650–679</span></label>
              <label><input type="radio" name="score" value="600"><span>600–649</span></label>
              <label><input type="radio" name="score" value="550"><span>550–599</span></label>
              <label><input type="radio" name="score" value="300"><span>Under 550</span></label>
            </div>
          </fieldset>

          <fieldset class="choice">
            <legend>Priority</legend>
            <div class="seg seg-3" role="radiogroup">
              <label><input type="radio" name="goal" value="price" checked><span>Lowest price</span></label>
              <label><input type="radio" name="goal" value="promo"><span>0% promo</span></label>
              <label><input type="radio" name="goal" value="payment"><span>Lowest payment</span></label>
            </div>
          </fieldset>

          <div id="rec" aria-live="polite"></div>
          <div id="others"></div>
          <details id="more-wrap" class="more" hidden>
            <summary id="more-summary"></summary>
            <ul id="more" class="plan-list"></ul>
          </details>
          <details id="excluded-wrap" class="excluded" hidden>
            <summary id="excluded-summary"></summary>
            <ul id="excluded"></ul>
          </details>
        </section>
      </div>
    </main>

    <footer class="colophon">
      <p>America Home Financial</p>
      <p id="rates-as-of"></p>
    </footer>
  </div>

  <noscript><p class="noscript">This calculator needs JavaScript turned on.</p></noscript>
  <script>
/*
 * Dealer fee calculator — pure pricing math.
 * Works as a browser global (window.DealerCalc) and as a CommonJS module (for tests).
 * All percentages are passed in as whole numbers (e.g. 8 means 8%).
 */
(function (root) {
  'use strict';

  function num(v) {
    var n = typeof v === 'number' ? v : parseFloat(v);
    return isFinite(n) ? n : 0;
  }

  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  /**
   * Total job cost from estimating inputs:
   * materials plus a waste allowance, labor as hours x rate, subs and other.
   */
  function jobCost(input) {
    var materials = Math.max(0, num(input.materials));
    var waste = materials * (Math.max(0, num(input.wastePct)) / 100);
    var labor = Math.max(0, num(input.laborHours)) * Math.max(0, num(input.laborRate));
    var subs = Math.max(0, num(input.subs));
    var other = Math.max(0, num(input.other));
    return {
      materials: materials + waste,
      waste: waste,
      labor: labor,
      subs: subs,
      other: other,
      total: materials + waste + labor + subs + other,
    };
  }

  /**
   * Build a cash price from job costs using margin-on-price
   * (overhead and profit are expressed as a % of the selling price, not of cost).
   */
  function cashPriceFromCosts(input) {
    var cost = num(input.materials) + num(input.labor) + num(input.subs) + num(input.other);
    var oh = num(input.overheadPct) / 100;
    var m = num(input.marginPct) / 100;
    var denom = 1 - oh - m;
    if (denom <= 0) {
      return { cost: cost, error: 'Overhead + profit must be less than 100% of the price.' };
    }
    var price = cost / denom;
    return {
      cost: cost,
      price: price,
      overhead: price * oh,
      profit: price * m,
      markupPct: cost > 0 ? ((price - cost) / cost) * 100 : 0,
    };
  }

  /**
   * Gross up a price so that, after the lender takes its dealer fee on the
   * financed amount, the contractor still nets `net`.
   *   net = price - fee * (price - down)   =>   price = (net - fee*down) / (1 - fee)
   */
  function grossUp(net, feePct, down) {
    var f = num(feePct) / 100;
    var d = Math.max(0, num(down));
    if (f >= 1) return { error: 'Dealer fee must be under 100%.' };
    if (d >= net) {
      // Customer is paying it all in cash — nothing is financed.
      return { price: net, financed: 0, fee: 0, net: net, increase: 0, increasePct: 0 };
    }
    var price = (net - f * d) / (1 - f);
    var financed = price - d;
    var fee = financed * f;
    return {
      price: price,
      financed: financed,
      fee: fee,
      net: price - fee,
      increase: price - net,
      increasePct: net > 0 ? ((price - net) / net) * 100 : 0,
    };
  }

  /**
   * The common mistake: multiplying the price by (1 + fee%) instead of dividing by (1 - fee%).
   * Returns how much the contractor comes up short.
   */
  function naiveMarkup(net, feePct) {
    var f = num(feePct) / 100;
    var price = net * (1 + f);
    var fee = price * f;
    return { price: price, fee: fee, net: price - fee, shortfall: net - (price - fee) };
  }

  /**
   * One price for every customer (cash or financed) that covers the *expected*
   * dealer fees, given the share of customers you expect to finance.
   *   net = price * (1 - share * fee)
   */
  function blendedPrice(net, feePct, sharePct) {
    var f = num(feePct) / 100;
    var s = Math.min(1, Math.max(0, num(sharePct) / 100));
    var denom = 1 - f * s;
    if (denom <= 0) return { error: 'Invalid fee / share combination.' };
    var price = net / denom;
    var fee = price * f;
    return {
      price: price,
      increase: price - net,
      increasePct: net > 0 ? ((price - net) / net) * 100 : 0,
      netIfCash: price,
      netIfFinanced: price - fee,
      feeIfFinanced: fee,
      expectedNet: price - fee * s,
    };
  }

  /**
   * Blended price across a mix of plans (e.g. several lenders).
   * mix: [{ fee: pct, share: pct of all customers }]. Remaining share pays cash.
   *   net = price * (1 - sum(share_i * fee_i))
   */
  function blendedPriceMix(net, mix) {
    var totalShare = 0, weighted = 0;
    (mix || []).forEach(function (m) {
      var s = Math.max(0, num(m.share)) / 100;
      totalShare += s;
      weighted += s * (num(m.fee) / 100);
    });
    if (totalShare > 1.0000001) return { error: 'Shares add up to more than 100% of customers.' };
    var denom = 1 - weighted;
    if (denom <= 0) return { error: 'Invalid fee / share combination.' };
    var price = net / denom;
    return {
      price: price,
      increase: price - net,
      increasePct: net > 0 ? ((price - net) / net) * 100 : 0,
      financedShare: totalShare * 100,
      avgFeePct: totalShare > 0 ? (weighted / totalShare) * 100 : 0,
      netIfCash: price,
      expectedNet: price * denom,
      perPlan: (mix || []).map(function (m) {
        var fee = price * (num(m.fee) / 100);
        return { fee: fee, net: price - fee };
      }),
    };
  }

  /**
   * Approval waterfall: customers who want financing go to lenders in order;
   * anyone declined moves to the next lender. Declined by all => some still
   * buy with cash, the rest are lost.
   *   opts.applyPct         % of all customers who apply for financing
   *   opts.declinedCashPct  % of fully-declined customers who still buy with cash
   *   opts.lenders          [{ approvalPct, plans: [{ fee, splitPct }] }] in waterfall order
   * Plan splits within a lender are normalized to 100% (all on the first plan if they sum to 0).
   * Returns shares as % of ALL customers, and `mix` as % of CLOSED jobs, ready for blendedPriceMix.
   */
  function waterfall(opts) {
    var apply = Math.min(1, Math.max(0, num(opts.applyPct) / 100));
    var remaining = apply;
    var lenders = (opts.lenders || []).map(function (l) {
      var r = Math.min(1, Math.max(0, num(l.approvalPct) / 100));
      var reached = remaining;
      var approved = reached * r;
      remaining = reached - approved;
      var plans = l.plans || [];
      var splitSum = plans.reduce(function (t, p) { return t + Math.max(0, num(p.splitPct)); }, 0);
      return {
        reached: reached * 100,
        approved: approved * 100,
        splitSum: splitSum,
        plans: plans.map(function (p, i) {
          var w = splitSum > 0 ? Math.max(0, num(p.splitPct)) / splitSum : (i === 0 ? 1 : 0);
          return { fee: num(p.fee), share: approved * w * 100 };
        }),
      };
    });
    var dc = Math.min(1, Math.max(0, num(opts.declinedCashPct) / 100));
    var declined = remaining;
    var lost = declined * (1 - dc);
    var closed = 1 - lost;
    var mix = [];
    lenders.forEach(function (l) {
      l.plans.forEach(function (p) { mix.push({ fee: p.fee, share: closed > 0 ? p.share / closed : 0 }); });
    });
    return {
      lenders: lenders,
      declined: declined * 100,
      declinedCash: declined * dc * 100,
      lost: lost * 100,
      cashBuyers: (1 - apply + declined * dc) * 100,
      closed: closed * 100,
      mix: mix,
    };
  }

  /**
   * Turn compact lender rate sheets into a flat list of plans.
   * sheet: {
   *   name, minScore, maxLoan, note,
   *   sac: { months: fee%, ... }            same-as-cash: $0 payments, no interest if paid off in time
   *   zil: { months: fee%, ... }            zero-interest loan: equal payments, no interest
   *   installment: { aprs: [apr per row], minScore?, terms: [{ years, fees: [fee per row, null = n/a], minLoan?, minScore? }] }
   * }
   */
  function expandSheets(sheets) {
    return (sheets || []).map(function (sh) {
      var plans = [];
      Object.keys(sh.sac || {}).forEach(function (m) {
        plans.push({ kind: 'sac', promo: true, months: +m, apr: 0, fee: sh.sac[m],
          name: 'Same-as-cash, ' + m + ' months', minScore: sh.promoMinScore,
          note: '$0 payments. No interest if paid off within ' + m + ' months.' });
      });
      Object.keys(sh.zil || {}).forEach(function (m) {
        plans.push({ kind: 'zil', promo: true, months: +m, apr: 0, fee: sh.zil[m],
          name: 'Zero-interest loan, ' + m + ' months', minScore: sh.promoMinScore,
          note: 'Equal monthly payments, 0% interest.' });
      });
      var inst = sh.installment;
      if (inst) {
        inst.terms.forEach(function (t) {
          t.fees.forEach(function (fee, row) {
            if (fee == null) return;
            var apr = inst.aprs[row];
            plans.push({ kind: 'installment', promo: false, months: t.years * 12, apr: apr, fee: fee,
              name: t.years + '-year loan at ' + apr + '% APR', minLoan: t.minLoan,
              minScore: t.minScore != null ? t.minScore : inst.minScore,
              note: inst.note || '' });
          });
        });
      }
      return { name: sh.name, minScore: sh.minScore, minLoan: sh.minLoan, maxLoan: sh.maxLoan, note: sh.note, plans: plans };
    });
  }

  /**
   * Recommend a financing plan for a job.
   *   price   contractor's cash price
   *   lenders [{ name, minScore, minLoan, maxLoan, plans: [{ name, kind, fee, apr, months, minScore, minLoan, maxLoan, promo }] }]
   *           plan-level minScore/minLoan/maxLoan override the lender's
   *   opts.score  low end of the customer's credit range (e.g. 680 for "680-724")
   *   opts.goal   'price' (lowest dealer fee), 'promo' (no interest for a while), 'payment' (lowest monthly)
   * Each plan's loan amount is the financed price (cash price grossed up for its fee).
   * Returns { options: [...fits, best first], excluded: [...with reason] }.
   */
  function recommend(price, lenders, opts) {
    var score = num(opts && opts.score);
    var goal = (opts && opts.goal) || 'price';
    var pick = function (a, b) { return a != null ? a : b; };
    var usd = function (x) { return '$' + Math.round(x).toLocaleString('en-US'); };
    var options = [], excluded = [];
    (lenders || []).forEach(function (l) {
      (l.plans || []).forEach(function (p) {
        var g = grossUp(price, p.fee, 0);
        var item = {
          lender: l.name, lenderNote: l.note || '', plan: p.name, kind: p.kind || '', fee: num(p.fee), promo: !!p.promo,
          apr: num(p.apr), months: num(p.months), note: p.note || '',
          price: g.price, increase: g.increase, lenderFee: g.fee,
          payment: monthlyPayment(g.price, p.apr, p.months),
        };
        var minScore = num(pick(p.minScore, l.minScore));
        var minLoan = num(pick(p.minLoan, l.minLoan));
        var maxRaw = pick(p.maxLoan, l.maxLoan);
        var maxLoan = maxRaw == null ? Infinity : num(maxRaw);
        if (g.error) item.reason = g.error;
        else if (minScore > score) item.reason = 'Needs a ' + minScore + '+ credit score';
        else if (g.price < minLoan) item.reason = 'Loan must be over ' + usd(minLoan);
        else if (g.price > maxLoan) item.reason = 'Loan can\'t be over ' + usd(maxLoan);
        else if (goal === 'promo' && !item.promo) item.reason = 'Not a no-interest plan';
        (item.reason ? excluded : options).push(item);
      });
    });
    options.sort(function (a, b) {
      if (goal === 'payment') return a.payment - b.payment || a.fee - b.fee;
      return a.fee - b.fee || a.payment - b.payment;
    });
    return { options: options, excluded: excluded };
  }

  /** What happens to your margin if you absorb the fee instead of passing it on. */
  function absorbFee(cashPrice, profit, feePct) {
    var fee = num(cashPrice) * (num(feePct) / 100);
    var newProfit = num(profit) - fee;
    return {
      fee: fee,
      profit: newProfit,
      marginPct: cashPrice > 0 ? (newProfit / cashPrice) * 100 : 0,
    };
  }

  /** Standard amortized monthly payment. 0% APR => principal / months. */
  function monthlyPayment(principal, aprPct, months) {
    var p = num(principal);
    var n = Math.round(num(months));
    if (n <= 0 || p <= 0) return 0;
    var r = num(aprPct) / 100 / 12;
    if (r === 0) return p / n;
    return (p * r) / (1 - Math.pow(1 + r, -n));
  }

  var api = {
    expandSheets: expandSheets,
    recommend: recommend,
    jobCost: jobCost,
    cashPriceFromCosts: cashPriceFromCosts,
    grossUp: grossUp,
    naiveMarkup: naiveMarkup,
    blendedPrice: blendedPrice,
    blendedPriceMix: blendedPriceMix,
    waterfall: waterfall,
    absorbFee: absorbFee,
    monthlyPayment: monthlyPayment,
    round2: round2,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.DealerCalc = api;
})(typeof window !== 'undefined' ? window : this);
</script>
  <script>
/*
 * LENDER RATE SHEETS — the only file to edit when rates change.
 *
 * Source: America Home Financial "Financing Options" contractor rate sheets
 *   Foundation Finance (07/16/2026) and Regions Bank (2/27/26).
 *
 * Per lender:
 *   name           shown to contractors
 *   minScore       lowest credit score the lender approves
 *   promoMinScore  lowest credit score for same-as-cash / zero-interest plans (defaults to minScore)
 *   minLoan/maxLoan  loan amount limits for every plan (optional)
 *   note           shown with the recommendation
 *   sac            same-as-cash: { months: contractor fee % }
 *   zil            zero-interest loan, equal payments: { months: contractor fee % }
 *   installment    standard loans. `aprs` lists the customer APR for each row of the sheet;
 *                  each term lists the contractor fee for each row (null = not offered).
 *
 * Items marked CHECK are read from the sheet as printed but still need confirming.
 */
window.EXAMPLE_RATES = false;
window.RATES_AS_OF = 'Foundation 7/16/26, Regions 2/27/26';

window.LENDER_SHEETS = [
  {
    name: 'Foundation Finance',
    // Tiers: 1 = 725+, 2 = 680–724, 3 = 650–679, 4 = 600–649, 5 = 550–599
    // (Sheet prints Tier 5 as "550 – 559"; confirmed it means 550–599.)
    minScore: 550,
    // Promo plans use the lender's credit minimum (confirmed).
    note: '',
    sac: { 6: 3, 12: 6, 18: 9, 24: 14 },
    zil: { 12: 8.5, 24: 13.5, 36: 18, 48: 22, 60: 25 },
    installment: {
      // (Sheet prints the 5th rate as "69%"; confirmed it means 6.9%.)
      aprs: [11.9, 9.9, 8.9, 7.9, 6.9, 5.9],
      note: 'Lowest APRs are for well-qualified customers.',
      terms: [
        { years: 5, fees: [0, 4, 7, 9.5, 12, 14] },
        { years: 10, fees: [0, 4, 7, 9.5, 12, 14], minLoan: 7500 },
        { years: 12, fees: [0, 4, 7, 9.5, 12, 14], minLoan: 7500 },
        { years: 15, fees: [0, 4, 7, 9.5, 12, 14], minLoan: 25000, minScore: 680 },
        { years: 20, fees: [0, 5.5, 8.5, 11, 13.5, 15.5], minLoan: 35000, minScore: 680 },
      ],
    },
  },
  {
    name: 'Regions Bank',
    // Tier 1 = 680+. 620–679 may get a counter-offer from the bank.
    minScore: 680,
    note: 'Customers with 620–679 credit may get a counter-offer from Regions.',
    sac: { 6: 4.25, 9: 4.5, 12: 6, 18: 11.95, 24: 15.55 },
    zil: { 12: 10, 24: 12.75, 36: 14.75, 48: 18 },
    installment: {
      // CHECK: sheet prints the 2nd rate as 9.99%, higher than the 0%-fee rate of 8.99%.
      // Kept as printed until confirmed with Regions.
      aprs: [8.99, 9.99, 7.99, 6.99, 4.99, 2.99],
      note: 'Lowest APRs are for well-qualified customers.',
      terms: [
        { years: 5, fees: [0, 3.5, 6.5, 7.5, 12, 20.5], minLoan: 3500 },
        { years: 7, fees: [0, 3.75, 8, 10.5, 14, null], minLoan: 3500 },
        { years: 10, fees: [0, 4.75, 10, 12.5, 17.65, null], minLoan: 7500 },
        { years: 12, fees: [0, 5, 10.75, 13.25, 19.3, null], minLoan: 10000 },
      ],
    },
  },
];

  <script>
(function () {
  'use strict';
  var C = window.DealerCalc;
  var LENDERS = C.expandSheets(window.LENDER_SHEETS || []);
  var STORE_KEY = 'job-price-calc-v6';
  var OLD_KEY = 'job-price-calc-v5';

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var fmt = function (x) { return isFinite(x) ? money.format(x) : '—'; };
  var pct = function (x) { return isFinite(x) ? (Math.round(x * 100) / 100) + '%' : '—'; };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var n = function (v) { var x = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(x) ? x : 0; };
  var val = function (id) { return n($(id).value); };
  var radio = function (name) { var r = document.querySelector('input[name=' + name + ']:checked'); return r ? r.value : ''; };
  var setRadio = function (name, v) { var r = document.querySelector('input[name=' + name + '][value="' + v + '"]'); if (r) r.checked = true; };

  var FIELDS = ['materials', 'wastePct', 'laborHours', 'laborRate', 'subs', 'other', 'overheadPct', 'marginPct'];

  // ---------- persistence (per-browser convenience only) ----------
  function save() {
    try {
      var data = { v: 6, score: radio('score'), goal: radio('goal'), fields: {} };
      FIELDS.forEach(function (f) { data.fields[f] = $(f).value; });
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) { /* storage unavailable */ }
  }

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if (!data) return;
      if (data.fields) FIELDS.forEach(function (f) { if (data.fields[f] != null) $(f).value = data.fields[f]; });
      if (data.score && data.v === 6) setRadio('score', data.score);
      if (data.goal) setRadio('goal', data.goal);
    } catch (e) { /* ignore bad data */ }
  }

  // ---------- financing ----------
  function payText(o) {
    if (o.kind === 'sac') return '$0 for ' + o.months + ' mo';
    return 'about ' + fmt(o.payment) + '/mo';
  }

  function renderFinancing(cashPrice) {
    if (!(cashPrice > 0)) {
      $('rec').innerHTML = '<p class="hint">Enter your costs above to see financing options.</p>';
      $('others').innerHTML = '';
      $('more-wrap').hidden = true;
      $('excluded-wrap').hidden = true;
      return;
    }
    var goal = radio('goal');
    var r = C.recommend(cashPrice, LENDERS, { score: n(radio('score')), goal: goal });

    if (!r.options.length) {
      $('rec').innerHTML = '<div class="no-rec">No plans available for this credit score.</div>';
    } else {
      var best = r.options[0];
      $('rec').innerHTML =
        '<div class="rec-card">' +
          '<div class="rec-head"><span class="rec-lender">' + esc(best.lender) + '</span><span class="rec-plan">' + esc(best.plan) + '</span></div>' +
          '<div class="rec-grid">' +
            '<div><span>Charge</span><strong class="rec-price">' + fmt(best.price) + '</strong></div>' +
            '<div><span>Payment</span><strong>' + payText(best).replace(/^about /, '') + '</strong></div>' +
            '<div><span>Dealer fee</span><strong>' + (best.fee === 0 ? 'None' : pct(best.fee) + ' (' + fmt(best.lenderFee) + ')') + '</strong></div>' +
          '</div>' +
        '</div>';
    }

    var rest = r.options.slice(1);
    var row = function (o) {
      return '<li class="plan"><div class="plan-info"><div class="plan-name">' + esc(o.plan) + '</div>' +
        '<div class="plan-meta">' + esc(o.lender) + ', ' + (o.fee === 0 ? 'no dealer fee' : pct(o.fee) + ' dealer fee') + '</div></div>' +
        '<div class="plan-figs"><strong>' + fmt(o.price) + '</strong><span>' + payText(o).replace(/^about /, '') + '</span></div></li>';
    };
    var SHOW = 3;
    $('others').innerHTML = rest.length ?
      '<ul class="plan-list">' + rest.slice(0, SHOW).map(row).join('') + '</ul>' : '';
    var more = rest.slice(SHOW);
    $('more-wrap').hidden = !more.length;
    $('more-summary').textContent = more.length + ' more';
    $('more').innerHTML = more.map(row).join('');

    $('excluded-wrap').hidden = !r.excluded.length;
    $('excluded-summary').textContent = r.excluded.length + ' not available';
    $('excluded').innerHTML = r.excluded.map(function (o) {
      return '<li><span>' + esc(o.lender) + ', ' + esc(o.plan) + '</span><em>' + esc(o.reason) + '</em></li>';
    }).join('');
  }

  // ---------- main update ----------
  function update() {
    var cost = C.jobCost({
      materials: val('materials'), wastePct: val('wastePct'),
      laborHours: val('laborHours'), laborRate: val('laborRate'),
      subs: val('subs'), other: val('other'),
    });
    $('cost-total').textContent = fmt(cost.total);

    var price = C.cashPriceFromCosts({ materials: cost.total, overheadPct: val('overheadPct'), marginPct: val('marginPct') });
    var bad = !!price.error;
    $('price-error').hidden = !bad;
    if (bad) {
      $('price-error').textContent = price.error;
      $('cash-price').textContent = '—';
      $('split-bar').innerHTML = '';
      $('split-legend').innerHTML = '';
      renderFinancing(0);
      save();
      return;
    }

    $('cash-price').textContent = fmt(price.price);

    var parts = [
      { label: 'Job cost', v: cost.total, cls: 's-cost' },
      { label: 'Overhead', v: price.overhead, cls: 's-oh' },
      { label: 'Profit', v: price.profit, cls: 's-profit' },
    ];
    var show = price.price > 0;
    $('split-bar').innerHTML = show ? parts.map(function (p) {
      return p.v > 0 ? '<span class="' + p.cls + '" style="flex:' + p.v + '"></span>' : '';
    }).join('') : '';
    $('split-legend').innerHTML = show ? parts.map(function (p) {
      return '<li><i class="' + p.cls + '"></i>' + p.label + ' <b>' + fmt(p.v) + '</b></li>';
    }).join('') : '';

    renderFinancing(price.price);

    save();
  }

  // ---------- sliders ----------
  var MONEY = ['materials', 'laborRate', 'subs', 'other'];
  var grouped = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  function showValue(id, x) {
    $(id).value = MONEY.indexOf(id) >= 0 ? grouped.format(x) : String(Math.round(x * 100) / 100);
  }
  function syncSlider(id) {
    var r = document.querySelector('.slider[data-for="' + id + '"]');
    if (r) r.value = Math.min(n(r.max), Math.max(n(r.min), val(id)));
    if (r) r.style.setProperty('--fill', ((r.value - r.min) / (r.max - r.min) * 100) + '%');
  }

  // ---------- events ----------
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.classList.contains('slider')) { showValue(t.dataset.for, n(t.value)); syncSlider(t.dataset.for); }
    else if (FIELDS.indexOf(t.id) >= 0) syncSlider(t.id);
    update();
  });
  // tidy the typed number (commas, no stray characters) when leaving a box
  document.addEventListener('focusout', function (e) {
    if (FIELDS.indexOf(e.target.id) >= 0) { showValue(e.target.id, val(e.target.id)); save(); }
  });
  document.addEventListener('change', function (e) { if (e.target.type === 'radio') update(); });

  // select the whole number when tapping a field, so it's easy to type over
  var justFocused = null;
  document.addEventListener('focusin', function (e) {
    if (FIELDS.indexOf(e.target.id) < 0) return;
    e.target.select();
    justFocused = e.target;
    setTimeout(function () { if (document.activeElement === e.target && justFocused === e.target) e.target.select(); }, 0);
  });
  // keep the selection when the focusing click/tap ends
  document.addEventListener('mouseup', function (e) {
    if (e.target === justFocused) e.preventDefault();
    justFocused = null;
  });
  document.addEventListener('keydown', function () { justFocused = null; });

  // ---------- init ----------
  $('rates-as-of').textContent = window.RATES_AS_OF ? 'Rates as of ' + window.RATES_AS_OF + '. Subject to lender approval.' : '';
  load();
  FIELDS.forEach(function (f) { showValue(f, val(f)); syncSlider(f); });
  update();
})();
</script>
