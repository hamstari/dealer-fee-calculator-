name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the Wix embed file is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/ is stale: run 'npm run build' and commit" && exit 1)
